{% extends 'inventory/base.html' %}
{% block title %}Login - InvenTrack{% endblock %}
{% block content %}
<div class="login-panel">
  <div class="login-brand">
    <div class="login-logo">Inven<span>Track</span></div>
    <p class="login-subtitle">Inventory Management System</p>
  </div>
  <div class="card">
    <div class="card-title">Sign In</div>
    {% if messages %}{% for msg in messages %}<div class="alert alert-error">{{ msg }}</div>{% endfor %}{% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" class="form-control" autofocus required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:11px;">Sign In -></button>
    </form>
  </div>
</div>
{% endblock %}
