{% extends 'inventory/base.html' %}
{% block title %}Edit Category — InvenTrack{% endblock %}
{% block content %}
<div class="page-header">
  <a href="{% url 'category_list' %}" style="color:var(--muted); text-decoration:none; font-size:13px;">← Back to Categories</a>
  <h1 style="margin-top:6px;">Edit Category</h1>
</div>
<div class="card" style="max-width:520px;">
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label>Category Name</label>
      {{ form.name }}
    </div>
    {% if form.errors %}
    <div class="alert alert-error">Please correct the error and try again.</div>
    {% endif %}
    <div class="flex">
      <button type="submit" class="btn btn-primary">Save Category</button>
      <a href="{% url 'category_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
